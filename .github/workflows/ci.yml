name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Its postinstall runs `prisma generate` — the Prisma client is
      # generated, not committed, and typecheck needs it on disk before tsc
      # runs, so there's no separate db:generate step.
      - run: npm ci

      # Catches the case the pre-commit hook was bypassed (--no-verify, a
      # stale local hook install) — formatting itself is enforced there,
      # not fixed here. Cheap AST diff, no build needed, so it runs first.
      - run: npm run format:check

      # Fails if schema.prisma has changes not captured in a committed
      # migration — catches "edited the schema, forgot to run db:migrate"
      # before merge, the SQL-level review step a bad migration needs.
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - run: npm run typecheck

      - run: npm test

      # Builds the real server bundle and dispatches real Requests through
      # it (see vitest.smoke.config.ts) — proves the /api/v1 routes are
      # actually wired (right file, right verb, auth attached), not just
      # that their underlying functions work in isolation. `npm test`
      # above already uses the Prisma client npm ci's postinstall generated;
      # this reuses it.
      - run: npm run test:smoke

  # Split out of `test` so the Storybook build overlaps with typecheck,
  # tests and the smoke build instead of queueing behind them. Its own
  # prebuild-storybook regenerates the fonts it needs (scripts/buildFonts.ts),
  # since it doesn't share test's workspace.
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build-storybook

  # The one required status check on main's branch protection is `check`.
  # Before the split, `check` included build-storybook; this gate keeps that
  # true, so a PR that breaks only the Storybook build still can't merge.
  # `if: always()` matters: a gate skipped because a dependency failed would
  # count as passing.
  check:
    needs: [test, storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$TEST" = success && test "$STORYBOOK" = success
        env:
          TEST: ${{ needs.test.result }}
          STORYBOOK: ${{ needs.storybook.result }}
