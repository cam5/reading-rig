name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # api:compat below reads openapi/api-v1.json off the PR's base
          # branch and walks BASE..HEAD commit messages for the override
          # trailer — both need real history, not a depth-1 clone.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Catches the case the pre-commit hook was bypassed (--no-verify, a
      # stale local hook install) — formatting itself is enforced there,
      # not fixed here. Cheap AST diff, no build needed, so it runs first.
      - run: npm run format:check

      # The Prisma client is generated, not committed, so typecheck needs it
      # on disk before tsc runs.
      - run: npm run db:generate

      # Fails if schema.prisma has changes not captured in a committed
      # migration — catches "edited the schema, forgot to run db:migrate"
      # before merge, the SQL-level review step a bad migration needs.
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - run: npm run typecheck

      # Fails if this PR changes openapi/api-v1.json in a way that breaks a
      # client already built against the base branch's copy — the shipped
      # iOS app generates its types from that file. Pull requests only:
      # on a push to main there is no "before" to protect. The committed
      # file itself is kept honest by openapi.server.test.ts under npm test.
      # Override: an `API-Breaking-Change: <reason>` commit trailer — see
      # MIGRATIONS.md.
      - if: github.event_name == 'pull_request'
        run: npm run api:compat
        env:
          BASE_REF: origin/${{ github.base_ref }}

      - run: npm test

      # Builds the real server bundle and dispatches real Requests through
      # it (see vitest.smoke.config.ts) — proves the /api/v1 routes are
      # actually wired (right file, right verb, auth attached), not just
      # that their underlying functions work in isolation. `npm test`
      # above already built db:generate's Prisma client; this reuses it.
      - run: npm run test:smoke

      - run: npm run build-storybook
