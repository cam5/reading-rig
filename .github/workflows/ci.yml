name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so typecheck needs it
      # on disk before tsc runs.
      - run: npm run db:generate

      # Fails if schema.prisma has changes not captured in a committed
      # migration — catches "edited the schema, forgot to run db:migrate"
      # before merge, the SQL-level review step a bad migration needs.
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - run: npm run typecheck

      - run: npm test

      - run: npm run build-storybook
