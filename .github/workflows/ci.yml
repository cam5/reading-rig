name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so typecheck needs it
      # on disk before tsc runs.
      - run: npm run db:generate

      - run: npm run typecheck

      - run: npm test
