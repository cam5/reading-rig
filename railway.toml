# Railway config-as-code — https://docs.railway.com/reference/config-as-code
# Fields not listed here (replicas, region, etc.) keep whatever's already
# set in the dashboard.
#
# No deploy.preDeployCommand here: Railway's pre-deploy commands run in a
# separate container with no volume access at all (confirmed against a live
# PR environment — see scripts/release.ts). Migrations against the SQLite
# volume have to run inside the actual runtime container, so `npm start`
# runs them (release.ts) before starting the server. The two settings below
# are what keep that safe:

[deploy]
# Railway keeps the previous deployment serving traffic until this returns
# 200 — a container stuck failing its migration/release step (or crashing
# on boot for any other reason) never receives traffic; the old deployment
# just keeps serving until this either passes or retries run out.
healthcheckPath = "/healthz"
healthcheckTimeout = 300

# Caps how long a broken deploy spends retrying before Railway gives up and
# marks it failed — a few fast tries surfaces a real problem quickly instead
# of the original incident's 10 retries over ~4 minutes.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
