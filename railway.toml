# Railway config-as-code — https://docs.railway.com/reference/config-as-code
# Fields not listed here (replicas, region, restart policy details not named
# below, etc.) keep whatever's already set in the dashboard.

[deploy]
# Runs once, before the new instance takes traffic (scripts/release.ts).
# This is what stops a rejected migration from crash-looping the running
# container: failure here blocks the deploy while the previous instance
# keeps serving, instead of the new instance retrying boot in place.
preDeployCommand = "npm run release"

# Railway won't cut traffic to the new instance (or fail it) until this
# returns 200 — lets a bad release step or crash on boot fail the deploy
# cleanly while the previous instance keeps serving.
healthcheckPath = "/healthz"
healthcheckTimeout = 300

# Restart on genuine runtime crashes, but cap it — a handful of tries
# surfaces a real problem fast instead of retrying for minutes.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
